# Entorno local completo: PostgreSQL + RabbitMQ + microservicio.
#   ./scripts/init-env.sh      (o scripts/init-env.ps1)  -> genera .env con secretos aleatorios
#   docker compose up --build
#
# Basado en starter/docker-compose.yml con tres cambios justificados:
#  1. PostgreSQL ejecuta db/001_esquema.sql al crear el volumen.
#  2. RabbitMQ define un usuario propio: "guest" solo acepta conexiones desde localhost
#     y el servicio se conecta desde otro contenedor.
#  3. Se agrega el servicio "auditoria-api".
#
# Ningún secreto vive en este archivo: todos se leen de .env (no versionado). En Kubernetes vienen
# de un Secret y la validación JWT usa el JWKS de Entra ID, sin clave compartida.
services:
  postgres:
    image: postgres:16-alpine
    container_name: eval-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER en .env (ver .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env (ver .env.example)}
      POSTGRES_DB: auditdb
    ports: ["5432:5432"]
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d auditdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: eval-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Defina RABBITMQ_USER en .env (ver .env.example)}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD en .env (ver .env.example)}
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  auditoria-api:
    build: .
    container_name: auditoria-api
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Auditoria: "Host=postgres;Port=5432;Database=auditdb;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Gss Encryption Mode=Disable"
      Autenticacion__Issuer: "https://sts.windows.net/eval-tenant/"
      Autenticacion__Audience: "api://corefid-audit"
      Autenticacion__ClaveFirma: ${JWT_CLAVE_FIRMA:?Defina JWT_CLAVE_FIRMA en .env (ver .env.example)}
      Outbox__Publicador: RabbitMq
      RabbitMq__Host: rabbitmq
      RabbitMq__Usuario: ${RABBITMQ_USER}
      RabbitMq__Clave: ${RABBITMQ_PASSWORD}
    ports: ["8080:8080"]
