# Plantilla. El Secret real lo crea el pipeline desde el gestor de secretos (Key Vault /
# External Secrets Operator); nunca se versiona con valores.
apiVersion: v1
kind: Secret
metadata:
  name: auditoria-secret
  namespace: corefid
type: Opaque
stringData:
  ConnectionStrings__Auditoria: "<cadena-de-conexion>"
  RabbitMq__Usuario: "<usuario>"
  RabbitMq__Clave: "<clave>"
