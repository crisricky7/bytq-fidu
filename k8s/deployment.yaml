apiVersion: apps/v1
kind: Deployment
metadata:
  name: auditoria-api
  namespace: corefid
  labels: { app: auditoria-api }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: auditoria-api }
  template:
    metadata:
      labels: { app: auditoria-api }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: registry.corefid.local/auditoria-api:1.0.0
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: auditoria-config }
            - secretRef: { name: auditoria-secret }
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          # Arranque: tolera una BD lenta sin que liveness mate el pod.
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            failureThreshold: 24
          # Liveness solo verifica el proceso: una BD caída no debe provocar reinicios en cascada.
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          # Readiness verifica la BD: si falla, el pod sale del Service y deja de recibir tráfico.
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 2
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: auditoria-api
  namespace: corefid
spec:
  selector: { app: auditoria-api }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: auditoria-api
  namespace: corefid
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: auditoria-api }
